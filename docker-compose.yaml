services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-retro_exchange}
      POSTGRES_USER: ${DB_USER:-retro_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-retro_pass}
    ports:
      - "5432:5432"
    volumes:
      - retro_db:/var/lib/postgresql/data
    networks:
      - retro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-retro_user} -d ${DB_NAME:-retro_exchange} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    environment:
      # KRaft single-node configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    networks:
      - retro_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_INIT: "1"
      INSTANCE_ID: "api1"
      # Read DATABASE_URL from environment (.env) — do not include quoted default here
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-please-very-long-string}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      USERS_TOPIC: ${USERS_TOPIC:-users}
      OFFERS_TOPIC: ${OFFERS_TOPIC:-offers}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retro_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_INIT: "0"
      INSTANCE_ID: "api2"
      # Read DATABASE_URL from environment (.env) — do not include quoted default here
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-please-very-long-string}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      USERS_TOPIC: ${USERS_TOPIC:-users}
      OFFERS_TOPIC: ${OFFERS_TOPIC:-offers}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retro_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  email_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      USERS_TOPIC: ${USERS_TOPIC:-users}
      OFFERS_TOPIC: ${OFFERS_TOPIC:-offers}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-email_worker_group}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - retro_net
    command: ["python", "-m", "app.email_worker"]
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - retro_net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - retro_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  grafana:
    image: grafana/grafana:9.5.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - retro_net
    depends_on:
      - prometheus

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://retro_user:retro_pass@db:5432/retro_exchange?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - retro_net
    depends_on:
      db:
        condition: service_healthy

  kafka_exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    networks:
      - retro_net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    command: ["-nginx.scrape-uri", "http://nginx:80/stub_status"]
    ports:
      - "9113:9113"
    networks:
      - retro_net
    depends_on:
      - nginx

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - retro_net

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - retro_net
    depends_on:
      redis:
        condition: service_healthy

  kafka_init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c","/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic users --partitions 1 --replication-factor 1 --if-not-exists || true && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic offers --partitions 1 --replication-factor 1 --if-not-exists || true"]
    networks:
      - retro_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - retro_net
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  locust:
    image: locustio/locust:2.24.0
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/locustfile.py:ro
    command: ["-f", "/locustfile.py", "--host", "http://nginx:80"]
    networks:
      - retro_net
    depends_on:
      - nginx

volumes:
  retro_db:
  grafana_data:
  redis_data:

networks:
  retro_net:
    driver: bridge
