global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'retro_api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api1:8000', 'api2:8000']

  - job_name: 'postgres'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'kafka'
    metrics_path: /metrics
    static_configs:
      - targets: ['kafka_exporter:9308']

  - job_name: 'nginx'
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'node'
    metrics_path: /metrics
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'redis'
    metrics_path: /metrics
    static_configs:
      - targets: ['redis_exporter:9121']
